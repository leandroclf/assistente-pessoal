<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat IA - HIVEPlace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --hive-dark: #1a1a1a;
      --hive-dark-secondary: #2b2b2b;
      --hive-gold: #f0a500;
      --hive-amber: #cf7500;
      --hive-honey: #ffbf00;
      --hive-text: #e0e0e0;
      --hive-border-radius: 12px;
    }

    body {
      background-color: var(--hive-dark);
      color: var(--hive-text);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path fill="none" stroke="%23cf7500" stroke-width="1" d="M50 0 L75 25 L75 75 L50 100 L25 75 L25 25 Z"></path></svg>');
      background-size: 80px 80px;
      background-repeat: repeat;
      opacity: 0.05;
      z-index: -1;
    }

    .header {
      padding: 1rem 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(207, 117, 0, 0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--hive-gold);
      font-weight: bold;
      font-size: 1.5rem;
    }

    .logo-icon {
      color: var(--hive-amber);
    }

    h2 {
      color: var(--hive-gold);
      font-weight: 600;
      margin-bottom: 1.5rem;
      position: relative;
      display: inline-block;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 40px;
      height: 3px;
      background-color: var(--hive-amber);
      border-radius: 3px;
    }

    #chatBox {
      height: calc(100vh - 220px);
      min-height: 350px;
      overflow-y: auto;
      background: var(--hive-dark-secondary);
      padding: 1rem;
      border-radius: var(--hive-border-radius);
      margin-bottom: 1rem;
      border: 1px solid rgba(207, 117, 0, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      scrollbar-width: thin;
      scrollbar-color: var(--hive-amber) var(--hive-dark-secondary);
    }

    #chatBox::-webkit-scrollbar {
      width: 6px;
    }

    #chatBox::-webkit-scrollbar-track {
      background: var(--hive-dark-secondary);
    }

    #chatBox::-webkit-scrollbar-thumb {
      background-color: var(--hive-amber);
      border-radius: 20px;
    }

    .msg-container {
      display: flex;
      position: relative;
      margin-bottom: 1.2rem;
    }

    .card-user, .card-bot {
      max-width: 75%;
      border-radius: var(--hive-border-radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      margin-bottom: 1rem;
      word-break: break-word;
      position: relative;
      padding-left: 3.5rem !important;
    }

    .card-user {
      background-color: var(--hive-amber);
      color: #fff;
    }

    .card-bot {
      background-color: var(--hive-dark-secondary);
      border: 1px solid rgba(240, 165, 0, 0.2);
      color: #fff;
    }
    
    .msg-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      opacity: 0.9;
      color: var(--hive-gold);
    }
    
    .msg-time {
      font-size: 0.7rem;
      opacity: 0.7;
      text-align: right;
      margin-top: 5px;
      font-style: italic;
      color: #fff;
    }

    .input-container {
      background-color: var(--hive-dark-secondary);
      border-radius: var(--hive-border-radius);
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(207, 117, 0, 0.1);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    .input-group input {
      background-color: rgba(26, 26, 26, 0.7);
      color: #fff;
      border: 1px solid rgba(207, 117, 0, 0.2);
      border-radius: var(--hive-border-radius);
      padding: 0.75rem 1rem;
      transition: all 0.3s ease;
      flex-grow: 1;
    }
    .input-group input::placeholder {
      color: #fff;
      opacity: 0.7;
    }

    .btn {
      border-radius: var(--hive-border-radius);
      padding: 0.75rem 1.25rem;
      transition: all 0.3s ease;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(240, 165, 0, 0.10);
      outline: none;
    }
    .btn:focus {
      box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.3);
      border-color: var(--hive-gold);
    }
    .btn-send {
      background: linear-gradient(90deg, var(--hive-gold) 60%, var(--hive-amber) 100%);
      color: #1a1a1a;
      border: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .btn-send:hover, .btn-send:focus {
      background: linear-gradient(90deg, var(--hive-amber) 60%, var(--hive-gold) 100%);
      color: #fff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 16px rgba(240, 165, 0, 0.15);
    }
    .btn-reset {
      background-color: transparent;
      color: var(--hive-gold);
      border: 1.5px solid var(--hive-gold);
      font-weight: 600;
      margin-left: 0.5rem;
    }
    .btn-reset:hover, .btn-reset:focus {
      background-color: rgba(240, 165, 0, 0.15);
      color: #fff;
      border-color: var(--hive-amber);
      box-shadow: 0 2px 8px rgba(240, 165, 0, 0.10);
    }

    @media (max-width: 768px) {
      .card-user, .card-bot {
        max-width: 90%;
      }

      #chatBox {
        height: calc(100vh - 250px);
      }

      .btn {
        padding: 0.6rem 1rem;
      }

      .input-group {
        flex-wrap: nowrap;
      }
    }

    @media (max-width: 576px) {
      .header {
        padding: 0.75rem 0;
      }

      h2 {
        font-size: 1.5rem;
      }

      .btn-reset {
        padding: 0.6rem;
      }

      .btn-reset span {
        display: none;
      }
    }

    /* Hexagon pattern for background - mais visível */
    .hexagon-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      opacity: 0.18;
      pointer-events: none;
      background: repeating-linear-gradient(120deg, transparent, transparent 70px, rgba(240,165,0,0.13) 71px, transparent 72px), repeating-linear-gradient(60deg, transparent, transparent 70px, rgba(240,165,0,0.13) 71px, transparent 72px);
      filter: drop-shadow(0 0 8px #f0a50055);
    }

    footer.corporate-footer {
      width: 100%;
      background: #181818;
      color: #fff;
      border-top: 1.5px solid var(--hive-amber);
      text-align: center;
      padding: 1.2rem 0 0.7rem 0;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-top: 2rem;
      box-shadow: 0 -2px 8px rgba(240, 165, 0, 0.05);
    }
    footer.corporate-footer a {
      color: var(--hive-gold);
      text-decoration: underline;
      margin: 0 0.5rem;
      font-weight: 500;
    }
    footer.corporate-footer a:hover {
      color: var(--hive-amber);
    }

    .bot-avatar {
      position: absolute;
      left: -3.2rem;
      top: 0.3rem;
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--hive-amber);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 12px 2px rgba(240, 165, 0, 0.18), 0 0 0 4px rgba(240, 165, 0, 0.08);
    }
    .bot-name {
      font-size: 0.95rem;
      color: var(--hive-gold);
      font-weight: 600;
      margin-bottom: 0.2rem;
      margin-left: 0.2rem;
      letter-spacing: 0.2px;
    }
    .reactions {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
    }
    .reaction-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s;
      opacity: 0.7;
    }
    .reaction-btn:hover {
      transform: scale(1.2);
      opacity: 1;
    }

    .quick-buttons {
      display: flex;
      gap: 0.5rem;
      margin: 0.7rem 0 0.7rem 0;
      flex-wrap: wrap;
    }
    .quick-btn {
      background: var(--hive-amber);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.2rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(240, 165, 0, 0.08);
    }
    .quick-btn.selected, .quick-btn:active {
      background: var(--hive-gold);
      color: #1a1a1a;
      transform: scale(1.05);
    }
    .quick-btn:hover {
      background: var(--hive-honey);
      color: #1a1a1a;
    }
    .security-tip {
      background: #2b2b2b;
      color: #f0a500;
      border-left: 4px solid var(--hive-amber);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.98rem;
      margin: 1rem 0 0.5rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="hexagon-bg"></div>

  <div class="container py-4">
    <div class="header">
      <div class="logo">
        <i class="bi bi-hexagon-fill logo-icon"></i>
        <span>HIVEPlace Enterprise</span>
        <div class="ms-2"><span class="status-indicator"></span><small>🟢 Online</small></div>
      </div>
      <div class="d-none d-md-flex align-items-center">
        <span class="badge bg-success me-2"><i class="bi bi-shield-check me-1"></i>🔒 Segurança Verificada</span>
        <span class="badge bg-primary"><i class="bi bi-clock-history me-1"></i>⏰ Suporte 24/7</span>
      </div>
    </div>

    <h2 class="mb-4"><i class="bi bi-headset me-2"></i>🤖 Atendimento Corporativo Premium</h2>

    <div id="chatBox" class="d-flex flex-column"></div>

    <div class="input-container">
      <div class="input-group">
        <input type="text" id="userInput" class="form-control" placeholder="💬 Digite sua solicitação ou dúvida corporativa..." autocomplete="off">
        <button id="sendBtn" class="btn btn-send">
          <i class="bi bi-send-fill me-1"></i> ✉️ Enviar
        </button>
        <button id="resetBtn" class="btn btn-reset" title="Resetar memória">
          <i class="bi bi-arrow-counterclockwise"></i><span>🔄 Nova Sessão</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Criar padrão de hexágonos para o fundo
    const hexagonBg = document.querySelector('.hexagon-bg');
    const hexSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
        <path fill="none" stroke="#cf7500" stroke-width="1" d="M50 0 L75 25 L75 75 L50 100 L25 75 L25 25 Z"></path>
      </svg>
    `;
    hexagonBg.innerHTML = hexSvg.repeat(100);

    function appendMessage(text, sender, id = null, showReactions = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg-container';
      if (id) msgDiv.id = id;

      const card = document.createElement('div');
      card.className = `card p-3 ${sender === 'user' ? 'card-user ms-auto' : 'card-bot me-auto'}`;
      
      // Adicionar avatar e nome do atendente virtual
      if (sender === 'bot') {
        const avatar = document.createElement('div');
        avatar.className = 'bot-avatar';
        avatar.innerHTML = `<svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="19" cy="19" r="19" fill="#fff"/><ellipse cx="19" cy="23" rx="10" ry="7" fill="#f0a500"/><ellipse cx="19" cy="17" rx="7" ry="6" fill="#cf7500"/><ellipse cx="15.5" cy="15.5" rx="1.5" ry="2" fill="#fff"/><ellipse cx="22.5" cy="15.5" rx="1.5" ry="2" fill="#fff"/><ellipse cx="19" cy="25" rx="2.5" ry="1.5" fill="#fff"/><rect x="17" y="10" width="4" height="6" rx="2" fill="#f0a500"/><ellipse cx="13" cy="11" rx="2" ry="1" fill="#cf7500"/><ellipse cx="25" cy="11" rx="2" ry="1" fill="#cf7500"/></svg>`;
        avatar.title = 'Bee | Suporte Técnico HIVEPlace';
        card.appendChild(avatar);
        const name = document.createElement('div');
        name.className = 'bot-name';
        name.textContent = 'Bee | Suporte Técnico HIVEPlace';
        card.appendChild(name);
      }
      // Adicionar ícone apropriado
      const icon = document.createElement('span');
      icon.className = 'msg-icon';
      if (sender === 'user') {
        icon.innerHTML = '<i class="bi bi-person-badge"></i>';
      } else if (id === 'digitando') {
        icon.innerHTML = '<i class="bi bi-three-dots"></i>';
      } else {
        icon.innerHTML = '<i class="bi bi-briefcase-fill"></i>';
      }
      // Criar elemento para o texto
      const textEl = document.createElement('div');
      textEl.innerHTML = text;
      // Adicionar timestamp
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      const now = new Date();
      timeEl.textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} • HIVEPlace Enterprise`;
      card.appendChild(icon);
      card.appendChild(textEl);
      card.appendChild(timeEl);
      // Reações rápidas
      if (sender === 'bot' && showReactions) {
        const reactions = document.createElement('div');
        reactions.className = 'reactions';
        ['👍', '😊', '👀'].forEach(emoji => {
          const btn = document.createElement('button');
          btn.className = 'reaction-btn';
          btn.innerText = emoji;
          btn.title = 'Enviar reação';
          btn.onclick = () => {
            btn.style.transform = 'scale(1.4)';
            setTimeout(() => btn.style.transform = '', 200);
          };
          reactions.appendChild(btn);
        });
        card.appendChild(reactions);
      }
      msgDiv.appendChild(card);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Fluxo guiado inicial
    let userProfile = null;
    let userService = null;

    function showProfileSelection() {
      const container = document.createElement('div');
      container.className = 'quick-buttons';
      ['Fornecedor', 'Consumidor'].forEach(profile => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.innerText = profile;
        btn.onclick = () => {
          userProfile = profile;
          Array.from(container.children).forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          setTimeout(() => {
            appendMessage(`<b>Ótimo! Agora, qual serviço HivePlace você deseja integrar?</b>`, 'bot');
            showServiceSelection();
          }, 400);
        };
        container.appendChild(btn);
      });
      chatBox.appendChild(container);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showServiceSelection() {
      const container = document.createElement('div');
      container.className = 'quick-buttons';
      const services = [
        'Débitos Veiculares',
        'Antifraude',
        'Consentimento',
        'Outro'
      ];
      services.forEach(service => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.innerText = service;
        btn.onclick = () => {
          userService = service;
          Array.from(container.children).forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          setTimeout(() => {
            showServiceInstructions(service);
          }, 400);
        };
        container.appendChild(btn);
      });
      chatBox.appendChild(container);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showServiceInstructions(service) {
      let docLink = 'https://portal.hiveplace.com.br/';
      let exampleLink = 'https://portal.hiveplace.com.br/';
      appendMessage(
        `<b>Perfeito!</b> Para integrar o serviço <b>${service}</b> como <b>${userProfile}</b>, siga as instruções abaixo:<br><ul><li>Acesse a <a href="${docLink}" target="_blank">documentação técnica oficial</a>.</li><li>Veja <a href="${exampleLink}" target="_blank">exemplos de código</a> para integração.</li><li>Em caso de dúvidas, utilize o comando <span style="background:#cf7500;color:#fff;padding:2px 8px;border-radius:8px;font-size:0.95em;">/faq</span> ou <span style="background:#cf7500;color:#fff;padding:2px 8px;border-radius:8px;font-size:0.95em;">/suporte</span>.</li></ul>`,
        'bot', null, true
      );
      appendMessage('<div class="security-tip"><i class="bi bi-shield-lock"></i> Nunca compartilhe credenciais, tokens ou dados sensíveis no chat. Siga sempre as boas práticas de segurança e LGPD.</div>', 'bot');
    }

    // Sugestões de perguntas como botões rápidos
    function showQuestionSuggestions() {
      const container = document.createElement('div');
      container.className = 'quick-buttons';
      const questions = [
        'Como integro a API de antifraude?',
        'Quais APIs estão disponíveis?',
        'Como funciona a autenticação?',
        'A HivePlace oferece exemplos de código?',
        'Como tratar erros de integração?'
      ];
      questions.forEach(q => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.innerText = q;
        btn.onclick = () => {
          enviarMensagem(q);
        };
        container.appendChild(btn);
      });
      chatBox.appendChild(container);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Comando para FAQ
    function showFAQ() {
      appendMessage('<b>Perguntas Frequentes:</b><ul><li><b>Quais APIs estão disponíveis?</b> Acesse <a href="https://portal.hiveplace.com.br/" target="_blank">nossa documentação</a>.</li><li><b>Como faço autenticação?</b> Veja detalhes em <a href="https://portal.hiveplace.com.br/" target="_blank">autenticação</a>.</li><li><b>Há exemplos de código?</b> Sim, acesse <a href="https://portal.hiveplace.com.br/" target="_blank">exemplos práticos</a>.</li><li><b>As APIs seguem LGPD?</b> Sim, todas as integrações respeitam LGPD e segurança.</li><li><b>O que fazer em caso de erro?</b> Consulte fallback na documentação ou acione <a href="mailto:contato@hiveplace.com">suporte técnico</a>.</li></ul>', 'bot', null, true);
    }

    // Comando para suporte humano
    function showSupport() {
      appendMessage('Se precisar de atendimento humano ou suporte avançado, envie um e-mail para <a href="mailto:contato@hiveplace.com">contato@hiveplace.com</a> ou acione nosso plantão 24x7.', 'bot', null, true);
    }

    // Interceptar comandos rápidos
    function interceptQuickCommands(msg) {
      if (msg.trim().toLowerCase() === '/faq') {
        showFAQ();
        return true;
      }
      if (msg.trim().toLowerCase() === '/suporte') {
        showSupport();
        return true;
      }
      return false;
    }

    // Ajustar função enviarMensagem para comandos rápidos
    function enviarMensagem(msg) {
      if (interceptQuickCommands(msg)) return;
      appendMessage(msg, 'user');
      const typingId = 'digitando';
      appendMessage('<div class="typing-indicator"><span></span><span></span><span></span></div> <span style="font-size:1.1em;">🤔</span> Bee está digitando...', 'bot', typingId);
      fetch('https://n8n.yukz.com.br/webhook/text-hive-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensagem: msg })
      })
      .then(res => res.json())
      .then(data => {
        setTimeout(() => {
          const typingMsg = document.getElementById(typingId);
          if (typingMsg) typingMsg.remove();
          appendMessage(data.resposta || '⚠️ <b>Solicitação não processada</b><br><br>Não foi possível processar sua solicitação no momento. Por favor, reformule ou entre em contato com nosso suporte técnico.', 'bot', null, true);
        }, 1500);
      })
      .catch(err => {
        console.error(err);
        const typingMsg = document.getElementById(typingId);
        if (typingMsg) typingMsg.remove();
        appendMessage('⚠️ <b>Erro de Comunicação</b><br><br>Detectamos um problema na conexão com nossos servidores. Nossa equipe de TI foi automaticamente notificada.<br><br>🔄 Por favor, tente novamente em alguns instantes ou contate nosso suporte pelo e-mail <b>contato@hiveplace.com</b>', 'bot', null, true);
      });
    }

    // Mensagem de boas-vindas e início do fluxo guiado
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        appendMessage('👋 <b>Olá! Eu sou Bee, Assistente HivePlace, especializada em integração via API.</b><br><br>Para começarmos, você é <b>fornecedor</b> ou <b>consumidor</b>?<br><br><span style="color:#f0a500">Selecione abaixo e depois escolha o serviço HivePlace que deseja integrar:</span>', 'bot', null, true);
        showProfileSelection();
        showQuestionSuggestions();
      }, 500);
    });

    sendBtn.addEventListener('click', () => {
      const message = userInput.value.trim();
      if (!message) return;
      enviarMensagem(message);
      userInput.value = '';
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    resetBtn.addEventListener('click', () => {
      chatBox.innerHTML = '';
      appendMessage('🔄 <b>Sessão Corporativa Reiniciada</b><br><br>Todos os dados da conversa anterior foram apagados conforme nossa política de privacidade.<br><br>✅ Como posso auxiliá-lo com suas demandas empresariais agora?', 'bot');

      fetch('https://n8n.yukz.com.br/webhook/text-hive-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reset: true })
      })
      .then(res => res.json())
      .then(data => {
        appendMessage(data.resposta || '✅ <b>Sessão Reiniciada com Sucesso</b><br><br>Seu ambiente de atendimento foi renovado conforme solicitado.<br><br>📊 Estou pronto para atender suas demandas corporativas.', 'bot');
      })
      .catch(err => console.error('Erro no reset:', err));
    });

    // Adicionar estilo para animação de rotação
    const style = document.createElement('style');
    style.textContent = `
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .typing-indicator {
        display: inline-block;
      }
      
      .typing-indicator span {
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: var(--hive-gold);
        border-radius: 50%;
        margin: 0 2px;
        opacity: 0.6;
        animation: typing 1.4s infinite both;
      }
      
      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }
      
      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }
      
      @keyframes typing {
        0% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0); }
      }
    `;
    document.head.appendChild(style);
  </script>

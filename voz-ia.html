<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Assistente IA Bee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .orb-container {
      position: relative;
    }

    .orb {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle at 30% 30%, #00ffff, #004d4d);
      border-radius: 50%;
      box-shadow: 0 0 40px #00ffff88;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2; /* Clique aqui */
    }

    .ring {
      position: absolute;
      top: -20px;
      left: -20px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      box-shadow: 0 0 30px #00ffff55;
      animation: pulse 2s infinite;
      z-index: 1;
      pointer-events: none; /* 🔥 ISSO FAZ A MAGIA DO CLIQUE FUNCIONAR */
    }
    
    .orb.listening {
      background: radial-gradient(circle at 30% 30%, #00ffcc, #005c5c);
      box-shadow: 0 0 50px #00ffff;
    }

    .orb.playing {
      background: radial-gradient(circle at 30% 30%, #ff00ff, #520052);
      box-shadow: 0 0 50px #ff00ff99;
    }

    .ring.listening {
      animation: vibrate 0.4s infinite;
    }

    .ring.playing {
      animation: glow 1s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes vibrate {
      0% { transform: scale(1.05); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1.05); }
    }

    @keyframes glow {
      0% { box-shadow: 0 0 40px #ff00ff88; }
      100% { box-shadow: 0 0 60px #ff00ffcc; }
    }

    .status-text {
      margin-top: 20px;
      font-size: 18px;
      color: #aaa;
      font-weight: 300;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="orb-container">
    <div id="ring" class="ring"></div>
    <div id="orb" class="orb" title="Clique para falar com a IA"></div>
  </div>
  <div id="status" class="status-text">Clique para falar</div>

  <audio id="beep" src="https://www.soundjay.com/button/sounds/button-3.mp3" preload="auto"></audio>

  <script>
    const orb = document.getElementById('orb');
    const ring = document.getElementById('ring');
    const statusText = document.getElementById('status');
    const beep = document.getElementById('beep');

    let recognition;
    let lastTranscript = "";
    let silenceTimeout;

    function startRecognition() {
      if (!('webkitSpeechRecognition' in window)) {
        alert('Este navegador não suporta reconhecimento de voz.');
        return;
      }

      beep.play();
      recognition = new webkitSpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.interimResults = true;
      recognition.continuous = true;
      lastTranscript = "";

      recognition.onstart = () => {
        orb.classList.add('listening');
        ring.classList.add('listening');
        statusText.textContent = "Ouvindo...";
      };

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            lastTranscript += event.results[i][0].transcript;
          }
        }

        clearTimeout(silenceTimeout);
        silenceTimeout = setTimeout(stopRecognition, 1000);
      };

      recognition.onerror = (event) => {
        console.error('Erro:', event.error);
        orb.classList.remove('listening');
        ring.classList.remove('listening');
        statusText.textContent = "Erro: " + event.error;
      };

      recognition.onend = () => {
        orb.classList.remove('listening');
        ring.classList.remove('listening');
      };

      recognition.start();
    }

    async function stopRecognition() {
      if (recognition) {
        recognition.stop();
        orb.classList.remove('listening');
        ring.classList.remove('listening');
        statusText.textContent = "Processando...";

        if (lastTranscript.trim() !== '') {
          try {
            const response = await fetch("https://n8n.yukz.com.br/webhook/receber-audio", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ pergunta: lastTranscript.trim() })
            });

            if (!response.ok) throw new Error("Erro na resposta do servidor");

            const blob = await response.blob();
            const audioURL = URL.createObjectURL(blob);
            const audio = new Audio(audioURL);

            audio.onplay = () => {
              orb.classList.add('playing');
              ring.classList.add('playing');
              statusText.textContent = "Respondendo...";
            };

            audio.onended = () => {
              orb.classList.remove('playing');
              ring.classList.remove('playing');
              statusText.textContent = "Clique para falar";
            };

            audio.play();

          } catch (err) {
            console.error("Erro ao enviar ou processar resposta:", err);
            statusText.textContent = "Erro ao falar com a IA";
          }
        }
      }
    }

    orb.addEventListener('click', () => {
      if (recognition && recognition.running) {
        stopRecognition();
      } else {
        startRecognition();
      }
    });
  </script>
</body>
</html>
